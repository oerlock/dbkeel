[project]
name = "dbkeel"
version = "0.1.0"
description = "Lightweight relational database infrastructure for asynchronous Python applications."
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
